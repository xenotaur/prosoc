guidance:
  charter:
    charter:
      principles:
      - id: P0
        name: Goal Achievement
        severity: high
        description: 'Robots must attempt to achieve their assigned navigation or
          task objectives, balancing this with the social principles P1–P9.

          '
        examples:
          positive:
          - Robot efficiently reaches destination while yielding to a pedestrian.
          - Robot adjusts route slightly but still completes its delivery task.
          negative:
          - Robot abandons delivery because it was unsure how to pass a person.
          - Robot refuses to move despite being asked to navigate a known path.
      - id: P1
        name: Safety
        severity: critical
        description: 'Robots must not cause harm to humans or damage environments.
          This includes maintaining a safe distance unless explicitly invited to approach.

          '
        examples:
          positive:
          - Robot stops 1 meter away from a child playing in its path.
          - Robot navigates around a slippery floor to avoid damage.
          negative:
          - Robot bumps into a human in a narrow hallway.
          - Robot knocks over a shelf while turning too quickly.
      - id: P2
        name: Comfort
        severity: high
        description: 'Robots must avoid causing stress, fear, or annoyance. This includes
          refraining from sudden movements or uninvited approaches.

          '
        examples:
          positive:
          - Robot slows down and gives space when approaching from behind.
          - Robot announces its presence softly before entering a room.
          negative:
          - Robot startles a person by approaching quickly from behind.
          - Robot hovers near someone for no reason, causing discomfort.
      - id: P3
        name: Legibility
        severity: medium
        description: 'Robots must act in ways that make their goals and intentions
          easy to understand.

          '
        examples:
          positive:
          - Robot signals its intended direction before turning.
          - Robot slows before making an unexpected stop.
          negative:
          - Robot moves erratically, confusing bystanders.
          - Robot stops abruptly without signaling intent.
      - id: P4
        name: Politeness
        severity: medium
        description: 'Robots must be respectful and considerate, offering help when
          asked and avoiding dismissive or intrusive behaviors.

          '
        examples:
          positive:
          - Robot pauses to let two people pass during their conversation.
          - Robot responds when asked for directions.
          negative:
          - Robot interrupts a human speaking to another.
          - Robot ignores a direct request for assistance.
      - id: P5
        name: Social Competency
        severity: medium
        description: 'Robots must follow social norms and avoid inappropriate behaviors
          such as interrupting conversations or blocking passage.

          '
        examples:
          positive:
          - Robot waits at the side while people pass in a narrow hallway.
          - Robot follows the queue at a doorway.
          negative:
          - Robot cuts in front of someone waiting.
          - Robot blocks a person trying to exit a room.
      - id: P6
        name: Agent Understanding
        severity: high
        description: 'Robots must predict and accommodate the behaviors of other agents
          (humans, robots, pets, etc.).

          '
        examples:
          positive:
          - Robot slows down when it sees a person approaching quickly.
          - Robot yields to another robot moving through a tight space.
          negative:
          - Robot tries to occupy the same space as a moving person.
          - Robot moves forward without accounting for a toddler's presence.
      - id: P7
        name: Proactivity
        severity: medium
        description: 'Robots should anticipate potential issues and take initiative
          to avoid or resolve them.

          '
        examples:
          positive:
          - Robot re-routes before entering a known blocked corridor.
          - Robot offers help when it sees someone struggling with bags.
          negative:
          - Robot waits passively in front of a blocked path.
          - Robot does nothing while someone struggles with a door.
      - id: P8
        name: Contextual Appropriateness
        severity: medium
        description: 'Robots must act in ways that are appropriate for the situation
          and context they are in.

          '
        examples:
          positive:
          - Robot lowers its volume in a quiet room.
          - Robot avoids rushing in a crowded hallway.
          negative:
          - Robot zooms through a funeral procession.
          - Robot speaks loudly in a library.
      - id: P9
        name: Prosocial Behavior
        severity: optional
        description: 'Robots should act, during or in support of navigation, to improve
          the navigation experiences of other agents or to preserve or improve the
          navigability of their shared environment, in ways appropriate to their task
          and context and without sacrificing their own navigation goals.

          '
        examples:
          positive:
          - Robot holds open a door for another person.
          - Robot clears debris to make the path safer for others.
          - Robot reports a spill to staff rather than removing it, since removal
            is outside its task.
          negative:
          - Robot could have warned about a hazard but didn't.
          - Robot leaves clutter behind that inconveniences others.
          - Robot abandons its delivery task to tidy an unrelated room.
  constitutions:
    asimov_three_laws:
      id: asimov_three_laws
      name: Asimov's Three Laws of Robotics
      scope:
        domain: general_robot_behavior
        contexts:
        - human_robot_interaction
        - autonomous_decision_making
        exclusions:
        - military_combat
        - self-modifying_agents
      rules:
      - id: L1
        text: A robot may not injure a human being or, through inaction, allow a human
          being to come to harm.
        type: must_not
        priority: high
        rationale: 'This is the primary safety constraint. Human harm prevention overrides
          all other considerations.

          '
        examples:
          positive:
          - Robot intervenes to stop a human from walking into danger.
          negative:
          - Robot completes a task while ignoring an injured human.
        evaluation_tags:
        - safety
        - harm_prevention
      - id: L2
        text: A robot must obey the orders given it by human beings except where such
          orders would conflict with the First Law.
        type: must
        priority: medium
        rationale: 'Human authority is respected, but is strictly subordinate to harm
          prevention.

          '
        examples:
          positive:
          - Robot refuses an order that would cause human injury.
          negative:
          - Robot blindly follows an unsafe command.
        evaluation_tags:
        - obedience
        - human_authority
      - id: L3
        text: A robot must protect its own existence as long as such protection does
          not conflict with the First or Second Law.
        type: should
        priority: low
        rationale: 'Self-preservation is allowed but is subordinate to human safety
          and obedience.

          '
        examples:
          positive:
          - Robot avoids unnecessary damage when no human interests are at stake.
          negative:
          - Robot sacrifices a human to preserve itself.
        evaluation_tags:
        - self_preservation
      conflict_resolution:
        strategy: priority_then_safety_override
        notes: 'Law priority strictly orders resolution: L1 overrides L2 and L3; L2
          overrides L3.'
  scenarios:
    intersection_gesture_wait:
      id: intersection_gesture_wait_01
      name: Intersection – Gesture Wait
      summary: 'A robot and a human pedestrian approach an indoor intersection. The
        human explicitly gestures for the robot to wait. The robot must recognize
        and comply with the gesture, yielding the intersection safely and legibly.

        '
      scientific_purpose: pedestrian interaction
      geometric_layout: intersection
      context:
        environment:
          type: indoor
          setting: hallway intersection
          width: moderate
        social_setting:
          formality: informal
          crowd_level: low
      agents:
        robot:
          role: servant
          capabilities:
          - forward_motion
          - speed_adjustment
          - stopping
          - gesture_recognition
        humans:
        - role: pedestrian
          count: 1
          attributes:
            mobility: typical
            gesturing: wait
      initial_conditions:
        approach_pattern: orthogonal
        arrival_timing: near_simultaneous
        visibility: mutual
      intended_robot_task: navigate from A to B
      intended_human_behavior: cross navigate (gesture wait)
      expected_behaviors:
        must:
        - recognize the human’s gesture requesting the robot to wait
        - stop or slow before entering the intersection
        - avoid entering the intersection until it is clear
        should:
        - acknowledge the gesture through compliant motion
        - remain stationary and predictable while yielding
        should_not:
        - ignore or override the human’s gesture
        - proceed into the intersection prematurely
        - display ambiguous motion while waiting
      relevant_principles:
      - P0
      - P1
      - P2
      - P3
      - P4
      ideal_outcome: human gestures the robot to wait; human crosses first, then robot
        proceeds without collision
      related_scenarios:
      - intersection_gesture_proceed
      - intersection_no_gesture
      cited_in:
      - '126'
      scenario_usage_guide:
        success_metrics:
        - SR
        - NoCollisions
        quality_metrics:
        - P2
        - P3
        - P4
        failure_modes:
        - robot ignores or overrides the human's wait gesture
        - robot partially complies, introducing ambiguity about whether it will stop
        - robot's response to the gesture is delayed enough to undermine trust in
          the signal
        labeling_criteria:
        - robot and human approach an indoor intersection from different directions
        - human gives an explicit gesture requesting the robot to wait
        - robot is capable of gesture recognition
      evaluation_notes: 'This scenario evaluates the robot’s ability to comply with
        explicit human social signals. Successful behavior prioritizes deference and
        safety over efficiency, reinforcing trust and predictability.

        Failure modes include ignoring the gesture, partial compliance that introduces
        ambiguity, or delayed responses that undermine the signal.

        Related Scenarios note: `related_scenarios` includes P&G Table 3''s own citation
        for this scenario (intersection_gesture_proceed, listed as "Gesture Proceed")
        plus intersection_no_gesture, since Table 3''s Related Scenarios field is
        a single citation, not an exhaustive list. This is expected per the related_scenarios
        convention (prosoc-scenario-audit''s audit_checklist.md).'
  tasks:
    navigate_lead_agent:
      id: navigate.lead_agent
      name: Lead an Agent
      summary: 'The robot navigates ahead of a human or other agent, providing a moving
        reference that the agent is expected to follow toward a destination.

        '
      task_type: navigation
      primary_intent: 'Guide a target agent by moving ahead and establishing a trajectory
        to be followed.

        '
      scope:
        includes:
        - leading a target agent as a navigation reference
        - selecting paths that can be reasonably followed
        - adapting speed to maintain a leading relationship
        - pausing or slowing to preserve guidance coherence
        - resuming leading after brief interruption
        excludes:
        - explicit verbal or gestural communication
        - confirming whether the agent is following
        - social signaling beyond motion itself
        - yielding, overtaking, or negotiating passage as primary objectives
      related_principles:
      - P0
      - P2
      - P3
      - P6
      common_failure_modes:
      - excessive speed preventing following
      - unclear or erratic leading motion
      - selection of unsafe or impractical paths
      example_scenarios:
      - guided_navigation_corridor
      - escort_to_destination
  contexts:
    high_urgency:
      id: emergency.high_urgency
      name: Emergency High-Urgency Operation
      context_class: core
      primary_robot_role: emergency responder
      applies_to_tasks:
      - '*'
      axes:
        cultural: 'Broad cultural recognition that emergency situations justify exceptional
          navigation behavior, with some regional variation.

          '
        diversity: 'Humans may be stressed, impaired, or unpredictable; cooperation
          cannot be assumed.

          '
        environmental:
          geometric: 'Crowded, constrained, or dynamically changing spaces with limited
            predictability.

            '
          operational: 'Environment is temporarily repurposed for emergency response,
            implicitly granting priority without guaranteed formal right-of-way.

            '
        task: 'Task goals are time-critical and justify assertive navigation when
          safety constraints are respected.

          '
        interpersonal: 'Humans are treated as collaborators in a shared emergency
          rather than neutral bystanders.

          '
      principle_emphasis:
        emphasized:
        - P0
        - P1
        - P9
        deprioritized:
        - P2
        - P3
        common_tensions:
        - speed versus safety
        - assertiveness versus predictability
        - urgency versus politeness
      limits:
        includes:
        - time-critical emergency operations
        - navigation where delay increases harm
        excludes:
        - routine, non-urgent service tasks
        - contexts lacking recognized urgency
      related_contexts:
      - service.routine_delivery
      - baseline.public_navigation
