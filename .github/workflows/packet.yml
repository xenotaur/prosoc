name: Packet drift check

on:
  pull_request:
    paths:
      # Every card family that can be a manifest member (loader.py's
      # PacketFamily registry) plus the manifest/packet tooling itself —
      # a member-card edit changes the assembled packet just as much as a
      # manifest edit does, so it must trip this check too.
      - "prosoc/charter/**"
      - "prosoc/constitutions/**"
      - "prosoc/contexts/**"
      - "prosoc/scenarios/**"
      - "prosoc/tasks/**"
      - "prosoc/manifests/**"
      - "prosoc/packet/**"
      - ".github/workflows/packet.yml"
  push:
    branches:
      - main

jobs:
  check-packet-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pyyaml jsonschema

      - name: Check every golden-having manifest for packet drift
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Must match the justification used to generate each committed
          # packet.golden.yml — see prosoc/packet/README.md.
          justification="CI packet-drift check (dev-mode golden; corpus not yet APPROVED)"
          goldens=(prosoc/manifests/*/packet.golden.yml)
          if [ "${#goldens[@]}" -eq 0 ]; then
            echo "no golden packets found; nothing to check"
            exit 0
          fi
          status=0
          for golden in "${goldens[@]}"; do
            manifest_dir=$(dirname "$golden")
            manifest="$manifest_dir/manifest.yml"
            echo "checking $manifest against $golden"
            if ! scripts/assemble "$manifest" --allow-unapproved "$justification" --check; then
              status=1
            fi
          done
          exit $status
