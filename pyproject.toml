[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prosoc"
version = "0.1.0"
description = "Prosocial robot navigation framework and constitutional charter system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Anthony Francis", email = "your@email.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "pyyaml",
    "jsonschema",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "build",
    "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["prosoc*"]

[tool.setuptools.package-data]
"prosoc.nca.packet" = ["README.md", "schema.json"]
"prosoc.nca.auditor" = ["schema.json"]
"prosoc.nca.utils.cards" = ["README.md"]
"prosoc.prnc.charter" = ["*.md", "*.yml", "*.json"]
"prosoc.prnc.scenarios" = ["*.md", "*.json", "*/*.md", "*/*.yml"]
"prosoc.prnc.tasks" = ["*.md", "*.json", "*/*.md", "*/*.yml"]
"prosoc.prnc.contexts" = ["*.md", "*.json", "*/*.md", "*/*.yml"]
"prosoc.constitutions" = ["*.md", "*.json", "*/*.md", "*/*.yml"]
"prosoc.manifests" = ["*.md", "*.json", "*/*.md", "*/*.yml"]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # bugbear
]

ignore = [
    "E501",  # line length (handled by Black)
]

# Explicitly allow fixing when requested
fixable = ["ALL"]
unfixable = []
